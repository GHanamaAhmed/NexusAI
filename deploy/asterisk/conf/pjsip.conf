[global]
type = global
; Calls in are matched by source address only, never by the From user.
endpoint_identifier_order = ip

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
; The provider is reached by IP and its certificate names another host.
verify_server = no
cert_file = /etc/asterisk/lines/tls/cert.pem
priv_key_file = /etc/asterisk/lines/tls/key.pem

[line-reg-tpl](!)
type = registration
transport = transport-tls
retry_interval = 60
forbidden_retry_interval = 300
fatal_retry_interval = 60
max_retries = 9000
auth_rejection_permanent = no

[line-ep-tpl](!)
type = endpoint
transport = transport-tls
context = inbound-reject
disallow = all
allow = alaw
allow = ulaw
dtmf_mode = auto
direct_media = no
rtp_symmetric = yes
force_rport = yes
media_encryption = no
rtp_timeout = 30

; Written by make-lines: the lines, their passwords and the provider's address.
#include "/etc/asterisk/lines/pjsip_lines.conf"
#include "/etc/asterisk/lines/pjsip_secrets.conf"
#include "/etc/asterisk/lines/pjsip_provider.conf"
