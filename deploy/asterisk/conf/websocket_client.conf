; Where Asterisk sends a call's audio: the voice app, on this server.
[nexus_media]
type = websocket_client
uri = ws://127.0.0.1:8787
protocols = media
connection_type = per_call_config
connection_timeout = 500
tls_enabled = no

; Test calls (demo.ts, volunteer.ts), next to the voice app: their own port.
[nexus_media_test]
type = websocket_client
uri = ws://127.0.0.1:8788
protocols = media
connection_type = per_call_config
connection_timeout = 500
tls_enabled = no
