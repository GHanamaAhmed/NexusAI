[general]
static = yes
writeprotect = yes

; Every call in is refused: these lines only call out.
[inbound-reject]
exten => _X.,1,Hangup(21)
exten => s,1,Hangup(21)

; The line check: plays each sample in sounds/nexus/samples, asks for a key
; after it and says the key back. Started from the console with
;   channel originate PJSIP/<number>@line01 extension s@test-call
[test-call]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Set(I=1)
 same => n(next),GotoIf($[${STAT(e,/var/lib/asterisk/sounds/nexus/samples/sample-${I}.alaw)}]?play:done)
 same => n(play),Verbose(1,TEST sample ${I})
 same => n,Playback(nexus/samples/sample-${I})
 same => n,Read(DIGIT,nexus/samples/press-a-key,1,,1,8)
 same => n,Verbose(1,TEST sample ${I} key ${IF($["${DIGIT}" = ""]?none:${DIGIT})})
 same => n,ExecIf($["${DIGIT}" != ""]?Playback(nexus/samples/digit-${DIGIT}))
 same => n,Set(I=$[${I} + 1])
 same => n,Goto(next)
 same => n(done),Hangup()

; Outbound calls: answering-machine detection first, then the voice app.
[outbound-amd]
exten => s,1,NoOp(call ${CALL_ID})
 same => n,AMD()
 same => n,Stasis(nexus,${CALL_ID},${AMDSTATUS},${AMDCAUSE})
 same => n,Hangup()
