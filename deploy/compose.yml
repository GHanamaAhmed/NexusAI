# NexusAI on one server. Settings and secrets live in /srv/nexus (see
# deploy/README.md); nothing here holds a number, password or address.
name: nexus

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Signs in the phone lines and carries the calls. Host networking, because
  # RTP uses a port range and ARI listens on localhost only.
  asterisk:
    image: ${ASTERISK_IMAGE:?}
    network_mode: host
    restart: unless-stopped
    # The provider's routing headers name a host that public DNS resolves to
    # other machines. Requests inside a call must reach the one handling it;
    # otherwise it never sees the ACK and drops the audio after 32 seconds.
    extra_hosts:
      - "${PROVIDER_ROUTE_NAME:?}:${PROVIDER_IP:?}"
    volumes:
      - /srv/nexus/asterisk:/etc/asterisk/lines:ro
      - /srv/nexus/sounds:/var/lib/asterisk/sounds/nexus:ro
      - asterisk-run:/var/run/asterisk
      - asterisk-spool:/var/spool/asterisk
    logging: *logging

  # Tasks and their results. Published on localhost only, for the voice app on
  # the host network.
  postgres:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_DB: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - /srv/nexus/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nexus", "-d", "nexus"]
      interval: 5s
      retries: 12
    mem_limit: 512m
    logging: *logging

  # Takes tasks from clients; Caddy is its only way in.
  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:?}@postgres:5432/nexus
      CALL_WINDOW: ${CALL_WINDOW:-09:00-20:00}
      # Which models can be chosen; the API doesn't hold the key itself.
      VOICE_PROVIDERS: ${OPENAI_API_KEY:+openai}
      # Whether designs can be made; the API doesn't hold the key itself.
      TEXT_PROVIDERS: ${META_API_KEY:+meta}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

  # Checks tasks with their clients, queues calls, sends results.
  worker:
    image: ${WORKER_IMAGE:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:?}@postgres:5432/nexus
      CALL_WINDOW: ${CALL_WINDOW:-09:00-20:00}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      META_API_KEY: ${META_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

  # Dials queued calls and holds the conversations. Host networking, to reach
  # ARI and the media socket on localhost. It dials nothing unless
  # CALLS_ENABLED is true, and only the numbers in ALLOWED_NUMBERS.
  voice:
    image: ${VOICE_IMAGE:?}
    network_mode: host
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:?}@127.0.0.1:5432/nexus
      GEMINI_API_KEY: ${GEMINI_API_KEY:?}
      ARI_PASSWORD: ${ARI_PASSWORD:?}
      CALLS_ENABLED: ${CALLS_ENABLED:-false}
      ALLOWED_NUMBERS: ${ALLOWED_NUMBERS:-}
      CALL_WINDOW: ${CALL_WINDOW:-09:00-20:00}
      DIAL_FORMAT: ${DIAL_FORMAT:-national}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_CALLS_PER_LINE: ${MAX_CALLS_PER_LINE:-}
      MAX_CALLS_TOTAL: ${MAX_CALLS_TOTAL:-}
      MAX_CALLS_PER_STORE: ${MAX_CALLS_PER_STORE:-}
    volumes:
      - asterisk-run:/var/run/asterisk:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Calls in progress finish before it stops: 10 minutes at most, the longest
    # an admin can set, plus the ringing and the goodbye.
    stop_grace_period: 12m
    mem_limit: 384m
    logging: *logging

  # HTTPS for the API, with certificates from Let's Encrypt.
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    command: caddy reverse-proxy --from ${PUBLIC_HOST:?} --to api:3000
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - /srv/nexus/caddy:/data
    depends_on:
      - api
    logging: *logging

volumes:
  asterisk-run:
  asterisk-spool:
