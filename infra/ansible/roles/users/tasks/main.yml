# ops: the owner's account, with sudo. deploy: CI's account, which can only run
# the deploy gate.
- name: ops user
  ansible.builtin.user:
    name: ops
    shell: /bin/bash
    groups: [sudo]
    append: true

- name: ops keys
  ansible.posix.authorized_key:
    user: ops
    key: "{{ ops_authorized_keys | join('\n') }}"
    exclusive: true
  # Needs the users above; a dry run doesn't create them.
  ignore_errors: "{{ ansible_check_mode }}"

- name: ops uses sudo without a password (SSH is key-only)
  ansible.builtin.copy:
    dest: /etc/sudoers.d/60-ops
    content: "ops ALL=(ALL:ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: deploy user
  ansible.builtin.user:
    name: deploy
    shell: /bin/bash
    password_lock: true

- name: NexusAI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: deploy
    mode: "0750"
  loop:
    - "{{ nexus_root }}"
    - "{{ nexus_root }}/bin"
  # Needs the users above; a dry run doesn't create them.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Deploy gate (the only command CI's key may run)
  ansible.builtin.copy:
    src: deploy-gate
    dest: "{{ nexus_root }}/bin/deploy-gate"
    owner: root
    group: deploy
    mode: "0750"
  # Needs the users above; a dry run doesn't create them.
  ignore_errors: "{{ ansible_check_mode }}"

- name: deploy .ssh directory
  ansible.builtin.file:
    path: /home/deploy/.ssh
    state: directory
    owner: deploy
    group: deploy
    mode: "0700"
  # Needs the users above; a dry run doesn't create them.
  ignore_errors: "{{ ansible_check_mode }}"

- name: deploy keys, each limited to the deploy gate
  ansible.builtin.copy:
    dest: /home/deploy/.ssh/authorized_keys
    content: |
      {% for key in deploy_authorized_keys %}
      command="{{ nexus_root }}/bin/deploy-gate",restrict {{ key }}
      {% endfor %}
    owner: deploy
    group: deploy
    mode: "0600"
  # Needs the users above; a dry run doesn't create them.
  ignore_errors: "{{ ansible_check_mode }}"
