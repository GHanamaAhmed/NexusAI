# Checks every pull request, and runs before every release (deploy.yml).
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

      - name: Scripts and workflows
        run: |
          shellcheck deploy/bin/* deploy/asterisk/entrypoint.sh deploy/asterisk/make-lines \
            infra/ansible/roles/users/files/deploy-gate
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -no-color

      - name: Server playbook
        run: |
          python3 -m pip install --quiet "ansible-core>=2.17,<2.19"
          ansible-galaxy collection install --timeout 120 ansible.posix
          cd infra/ansible && ansible-playbook site.yml --syntax-check

      - name: Compose file
        env:
          ASTERISK_IMAGE: example
          PROVIDER_ROUTE_NAME: sip.example.com
          PROVIDER_IP: 192.0.2.1
        run: docker compose -f deploy/compose.yml config -q
